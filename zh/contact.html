    section { padding: 80px 32px; }
    section .container { max-width: 1100px; margin: 0 auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
    .contact-item { display: flex; align-items: start; gap: 16px; margin-bottom: 32px; }
    .contact-item .icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(243,112,33,0.1); display: flex; align-items: center; justify-content: center; color: #F37021; font-size: 1.1em; flex-shrink: 0; }
    .contact-item h4 { font-size: 0.7em; color: #00000066; text-transform: uppercase; letter-spacing: 1px; }
    .contact-item p, .contact-item a { color: #1a2e56; font-weight: 500; text-decoration: none; }
    .contact-item a:hover { color: #F37021; }
    .form { background: #fafbfc; border: 1px solid rgba(0,0,0,0.04); border-radius: 16px; padding: 40px; }

    .form button:hover { background: #243d6f; }
    footer { background: linear-gradient(90deg, #0f1d3a 0%, #1a2e56 52%, #243d6f 100%); padding: 60px 32px 30px; color: rgba(255,255,255,0.7); font-size: 0.8em; text-align: center; }
    footer a { color: #F37021; text-decoration: none; }
    @media (max-width: 768px) {
