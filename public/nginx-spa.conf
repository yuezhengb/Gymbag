# ═══════════════════════════════════════════════════════════════════════════
# Nginx Configuration for Sofos & Partners SPA
# ═══════════════════════════════════════════════════════════════════════════
#
# Place this in your nginx server block.
# This configuration ensures React Router works correctly when deployed
# to a subdirectory (/html/).
#
# KEY POINTS:
#   1. All /html/ requests serve the static files from the html directory
#   2. /html/api/ requests are proxied to the backend Hono server
#   3. All other /html/* routes fallback to index.html (SPA behavior)

server {
    listen 80;
    server_name www.sofoslaw.cn www.sofos.cc www.sofos.com.cn;

    # ═══════════════════════════════════════════════════════════════════
    # Static assets — /html/ directory
    # ═══════════════════════════════════════════════════════════════════
    location /html/ {
        alias /var/www/sofoslaw/html/;
        try_files $uri $uri/ /html/index.html;
        index index.html;
    }

    # ═══════════════════════════════════════════════════════════════════
    # API — proxy to backend server (Node.js/Hono on port 3000)
    # ═══════════════════════════════════════════════════════════════════
    location /html/api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════════════════════════════
    # tRPC — proxy to backend server
    # ═══════════════════════════════════════════════════════════════════
    location /html/trpc/ {
        proxy_pass http://localhost:3000/trpc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ═══════════════════════════════════════════════════════════════════
    # Gzip compression
    # ═══════════════════════════════════════════════════════════════════
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}

# ═══════════════════════════════════════════════════════════════════════════
# If you want to redirect the root domain to /html/:
# ═══════════════════════════════════════════════════════════════════════════
# location = / {
#     return 301 /html/;
# }
# location / {
#     return 301 /html/$request_uri;
# }
